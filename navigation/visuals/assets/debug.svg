<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">排障：用四站证据缩小范围</title><desc id="desc">四个证据站依次为消息、时间与TF、地图与状态、速度。示例在消息站发现scan和lidar话题名不一致，统一名称后恢复接通。</desc>
  <defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd6"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ed8c24"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#268260"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb4d4d"/></marker></defs>
  <rect width="800" height="420" rx="20" fill="#f5f8fc"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <text x="28" y="44" fill="#233348" font-size="27" font-weight="700" text-anchor="start">排障：用四站证据缩小范围</text>
  <text x="772" y="72" fill="#63758b" font-size="14" font-weight="500" text-anchor="end">合成教学示意</text>
  <text x="29" y="109" fill="#63758b" font-size="22" font-weight="500" text-anchor="start">沿着数据走，找最早断开的地方</text><rect x="28" y="142" width="164" height="110" rx="15" fill="#ffffff" stroke="#cb4d4d" stroke-width="3"/><text x="110" y="184" fill="#233348" font-size="21" font-weight="700" text-anchor="middle">① 消息</text><text x="110" y="221" fill="#cb4d4d" font-size="19" font-weight="500" text-anchor="middle">Topic 名字</text><path d="M200 196 H215" fill="none" stroke="#246bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="222" y="142" width="164" height="110" rx="15" fill="#ffffff" stroke="#d9e2ed" stroke-width="2"/><text x="304" y="184" fill="#233348" font-size="21" font-weight="700" text-anchor="middle">② 时间 / TF</text><text x="304" y="221" fill="#63758b" font-size="19" font-weight="500" text-anchor="middle">是否对得上</text><path d="M394 196 H409" fill="none" stroke="#246bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="416" y="142" width="164" height="110" rx="15" fill="#ffffff" stroke="#d9e2ed" stroke-width="2"/><text x="498" y="184" fill="#233348" font-size="21" font-weight="700" text-anchor="middle">③ 地图 / 状态</text><text x="498" y="221" fill="#63758b" font-size="19" font-weight="500" text-anchor="middle">是否合理</text><path d="M588 196 H603" fill="none" stroke="#246bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="610" y="142" width="164" height="110" rx="15" fill="#ffffff" stroke="#d9e2ed" stroke-width="2"/><text x="692" y="184" fill="#233348" font-size="21" font-weight="700" text-anchor="middle">④ 速度</text><text x="692" y="221" fill="#63758b" font-size="19" font-weight="500" text-anchor="middle">是否发出</text><rect x="28" y="278" width="354" height="87" rx="14" fill="#fff0ed" stroke="#f1cdca" stroke-width="2"/><text x="49" y="311" fill="#cb4d4d" font-size="22" font-weight="700" text-anchor="start">发现断点</text><text x="49" y="344" fill="#cb4d4d" font-size="24" font-weight="700" text-anchor="start">/scan ≠ /lidar</text><path d="M396 322 H431" fill="none" stroke="#246bd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="445" y="278" width="329" height="87" rx="14" fill="#edf8f2" stroke="#c9e5d7" stroke-width="2"/><text x="466" y="311" fill="#268260" font-size="22" font-weight="700" text-anchor="start">修复后 ✓</text><text x="466" y="344" fill="#268260" font-size="22" font-weight="700" text-anchor="start">统一 Topic 名字，接通</text><text x="29" y="401" fill="#63758b" font-size="20" font-weight="500" text-anchor="start">先留证据，再改动；一次只解决一个断点</text>
  </g>
</svg>
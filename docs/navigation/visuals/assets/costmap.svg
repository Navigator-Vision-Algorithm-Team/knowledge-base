<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">代价地图：不能撞，也别贴墙走</title><desc id="desc">深灰色实心为障碍；橙色内圈表示机器人中心进入后车体会碰撞；蓝色外围是可行但代价增大的区域，橙色路线绕开碰撞区。</desc>
  <defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd6"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#ed8c24"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#268260"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb4d4d"/></marker></defs>
  <rect width="800" height="420" rx="20" fill="#f5f8fc"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <text x="28" y="44" fill="#233348" font-size="27" font-weight="700" text-anchor="start">代价地图：不能撞，也别贴墙走</text>
  <text x="772" y="72" fill="#63758b" font-size="14" font-weight="500" text-anchor="end">合成教学示意</text>
  <rect x="28" y="92" width="438" height="280" rx="16" fill="#ffffff" stroke="#d9e2ed" stroke-width="2"/><rect x="124" y="124" width="242" height="238" rx="70" fill="#eef4ff" stroke="#eef4ff" stroke-width="0"/><rect x="144" y="145" width="202" height="196" rx="55" fill="#dceaff" stroke="#dceaff" stroke-width="0"/><rect x="166" y="166" width="158" height="154" rx="40" fill="#bad3f7" stroke="#bad3f7" stroke-width="0"/><rect x="187" y="186" width="116" height="114" rx="25" fill="#ffe2bd" stroke="#ed8c24" stroke-width="2"/><rect x="210" y="208" width="70" height="70" rx="7" fill="#233348" stroke="#233348" stroke-width="0"/><text x="245" y="251" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">障碍</text><path d="M70 319 V158 Q70 145 86 145 H409 Q425 145 425 161 V308" fill="none" stroke="#ed8c24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange)"/><g transform="translate(70 319) rotate(-90) scale(0.72)">
      <rect x="-24" y="-21" width="48" height="10" rx="4" fill="#233348"/>
      <rect x="-24" y="11" width="48" height="10" rx="4" fill="#233348"/>
      <rect x="-23" y="-15" width="46" height="30" rx="9" fill="#246bd6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#dceaff"/>
      <path d="M0 0 H33" stroke="#246bd6" stroke-width="7" stroke-linecap="round"/>
      <path d="M15 -7 L25 0 L15 7" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g><path d="M425 337 V302" stroke="#233348" stroke-width="4" stroke-linecap="round"/>
      <path d="M427 302 L455 311 L427 320 Z" fill="#ed8c24"/><text x="492" y="132" fill="#233348" font-size="23" font-weight="700" text-anchor="start">实心：真实障碍</text><path d="M491 142 H461 L284 226" fill="none" stroke="#233348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="206" fill="#ed8c24" font-size="23" font-weight="700" text-anchor="start">内圈：不能进</text><text x="492" y="235" fill="#63758b" font-size="18" font-weight="500" text-anchor="start">车体会碰到障碍</text><path d="M490 216 H465 L304 255" fill="none" stroke="#ed8c24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="492" y="296" fill="#246bd6" font-size="23" font-weight="700" text-anchor="start">外圈：越近越贵</text><text x="492" y="326" fill="#63758b" font-size="18" font-weight="500" text-anchor="start">仍可走，通常优先绕开</text><path d="M490 305 H463 L347 325" fill="none" stroke="#246bd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="400" fill="#63758b" font-size="19" font-weight="500" text-anchor="start">以机器人中心判断；内圈大小取决于车体尺寸</text>
  </g>
</svg>
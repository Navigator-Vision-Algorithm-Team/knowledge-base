<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" aria-labelledby="title desc">
  <title id="title">四组运动，先算五秒后的答案</title>
  <desc id="desc">四组独立数据都从零位姿开始。静止不动，前进速度0.2米每秒得到x等于1米，侧移速度0.1米每秒得到y等于0.5米，旋转速度0.2弧度每秒得到yaw等于1弧度。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#087f80" stroke-width="2"/></marker></defs>
  <rect width="720" height="404" rx="18" fill="#f5f9fc"/>
  <g font-family="Microsoft YaHei,PingFang SC,system-ui,sans-serif" fill="#19314b">
    <text x="28" y="43" font-size="27" font-weight="700">先预测：5 秒后，位置或朝向变了多少？</text>
    <g fill="#fff" stroke="#d4e0e9" stroke-width="2"><rect x="24" y="66" width="326" height="138" rx="14"/><rect x="370" y="66" width="326" height="138" rx="14"/><rect x="24" y="222" width="326" height="138" rx="14"/><rect x="370" y="222" width="326" height="138" rx="14"/></g>
    <g font-size="25" font-weight="700"><text x="44" y="102">静止</text><text x="390" y="102">前进</text><text x="44" y="258">侧移</text><text x="390" y="258">旋转</text></g>
    <circle cx="80" cy="155" r="17" fill="#2463b4"/><text x="115" y="162" font-size="23">位置、朝向不变</text>
    <circle cx="408" cy="145" r="13" fill="#2463b4"/><path d="M431 145 H510" stroke="#087f80" stroke-width="4" marker-end="url(#arrow)"/><text x="540" y="153" font-size="25" fill="#087f80">1 m</text><text x="390" y="185" font-size="20">vx = 0.2 m/s</text>
    <circle cx="80" cy="318" r="13" fill="#2463b4"/><path d="M80 298 V278" stroke="#087f80" stroke-width="4" marker-end="url(#arrow)"/><text x="115" y="303" font-size="24" fill="#087f80">y = 0.5 m</text><text x="115" y="337" font-size="20">vy = 0.1 m/s</text>
    <circle cx="425" cy="316" r="13" fill="#2463b4"/><path d="M477 316 A52 52 0 0 0 453.1 272.2" fill="none" stroke="#087f80" stroke-width="4" marker-end="url(#arrow)"/><text x="510" y="299" font-size="24" fill="#087f80">yaw = 1 rad</text><text x="510" y="335" font-size="20">wz = 0.2 rad/s</text>
    <text x="360" y="389" text-anchor="middle" font-size="20" fill="#63758c">四个独立场景，从零位姿出发；公式生成的教学数据</text>
  </g>
</svg>
